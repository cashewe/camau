name: release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate source versions and release tag
        id: source
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: >-
          python tools/release.py source --root . --tag "$RELEASE_TAG"
          --github-output "$GITHUB_OUTPUT"

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: python -m pip install --upgrade pip mypy pytest ruff
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools
      - run: mypy
      - run: python -m pytest -q tests/test_release.py

  test:
    name: Python ${{ matrix.python }} / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        platform: [linux-x64, linux-arm64, windows-x64]
        include:
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: windows-x64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --upgrade pip maturin pytest pytest-asyncio hypothesis psutil
      - name: Build native Linux test wheel
        if: runner.os == 'Linux'
        run: maturin build --release --locked --compatibility linux --out dist
      - name: Build Windows test wheel
        if: runner.os == 'Windows'
        run: maturin build --release --locked --out dist
      - name: Install and import the built wheel
        run: >-
          python -c "import glob, subprocess, sys;
          wheels = glob.glob('dist/*.whl');
          assert len(wheels) == 1, wheels;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', wheels[0]]);
          import camau;
          assert camau.Router"
      - run: python -m pytest -q
      - run: cargo test --workspace --all-targets

  wheel:
    name: abi3 wheel / ${{ matrix.platform }}
    needs: release-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
            target: x86_64
            manylinux: "2_28"
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2_28"
          - platform: windows-x64
            os: windows-2025
            target: x64
            manylinux: "off"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Create clean platform artifact directory
        run: >-
          python tools/release.py prepare
          --directory release/${{ needs.release-check.outputs.version }}/${{ matrix.platform }}
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: >-
            --release --locked --compatibility pypi
            --out release/${{ needs.release-check.outputs.version }}/${{ matrix.platform }}
      - name: Inspect, install, and smoke-test exact wheel
        run: >-
          python tools/release.py wheel
          --directory release/${{ needs.release-check.outputs.version }}/${{ matrix.platform }}
          --version ${{ needs.release-check.outputs.version }}
          --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform }}
          path: release/${{ needs.release-check.outputs.version }}/${{ matrix.platform }}/*.whl
          if-no-files-found: error

  sdist:
    needs: release-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pinned maturin
        run: python -m pip install --upgrade pip maturin==1.15.0
      - name: Create clean sdist artifact directory
        run: >-
          python tools/release.py prepare
          --directory release/${{ needs.release-check.outputs.version }}/sdist
      - name: Build sdist
        run: >-
          maturin sdist
          --out release/${{ needs.release-check.outputs.version }}/sdist
      - name: Inspect and extract exact sdist
        run: >-
          python tools/release.py sdist
          --directory release/${{ needs.release-check.outputs.version }}/sdist
          --version ${{ needs.release-check.outputs.version }}
          --extract-to "$RUNNER_TEMP/camau-sdist"
      - name: Build locked wheel from extracted sdist
        working-directory: ${{ runner.temp }}/camau-sdist/camau-${{ needs.release-check.outputs.version }}
        run: >-
          maturin build --release --locked --compatibility linux
          --out ${{ runner.temp }}/camau-sdist-wheel
      - name: Install and smoke-test wheel rebuilt from sdist
        run: >-
          python tools/release.py wheel
          --directory "$RUNNER_TEMP/camau-sdist-wheel"
          --version ${{ needs.release-check.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: release/${{ needs.release-check.outputs.version }}/sdist/*.tar.gz
          if-no-files-found: error

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m pip install --upgrade pip pip-audit
      - run: python -m pip_audit --local

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-check, quality, test, wheel, sdist, audit]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Create clean aggregate artifact directory
        run: >-
          python tools/release.py prepare
          --directory release/${{ needs.release-check.outputs.version }}
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: release/${{ needs.release-check.outputs.version }}
          merge-multiple: true
      - name: Dry-run complete artifact set and PyPI availability
        run: >-
          python tools/release.py artifacts
          --directory release/${{ needs.release-check.outputs.version }}
          --version ${{ needs.release-check.outputs.version }}
          --check-pypi
      - uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          maturin-version: v1.15.0
          command: upload
          args: >-
            --non-interactive
            release/${{ needs.release-check.outputs.version }}/camau-${{ needs.release-check.outputs.version }}-cp311-abi3-manylinux_2_28_x86_64.whl
            release/${{ needs.release-check.outputs.version }}/camau-${{ needs.release-check.outputs.version }}-cp311-abi3-manylinux_2_28_aarch64.whl
            release/${{ needs.release-check.outputs.version }}/camau-${{ needs.release-check.outputs.version }}-cp311-abi3-win_amd64.whl
            release/${{ needs.release-check.outputs.version }}/camau-${{ needs.release-check.outputs.version }}.tar.gz
